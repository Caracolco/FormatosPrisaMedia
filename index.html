:root{
  --bg:#F3F2ED; --surface:#FFFFFF; --surface-2:#FAF9F5;
  --ink:#15181C; --ink-2:#444A53; --ink-3:#5E636C;
  --line:#D9D7CE; --line-2:#EAE8E0;
  --accent:#07794A; --accent-ink:#055B38; --accent-soft:#E2F1E9;
  --warn:#8A5200; --warn-soft:#FBF0DA;
  --danger:#B3261E; --danger-soft:#FBE7E4;
  --r:14px; --r-sm:10px;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:#B9B6AA var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#B9B6AA;border-radius:8px;border:3px solid var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;padding:10px 0;text-decoration:none;color:inherit;background:none;border:0}
.brand img{height:34px;width:auto}
.brand b{font-weight:600;font-size:15px;padding-left:14px;border-left:1px solid var(--line);line-height:1.2;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 16px;border-radius:10px;font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap;display:flex;gap:8px;align-items:center;min-height:44px}
.tab:hover{background:var(--line-2);color:var(--ink)}
.tab[aria-current=page]{background:var(--ink);color:#fff}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;display:inline-grid;place-items:center}
.tab[aria-current=page] .badge{background:#fff;color:var(--ink)}
@media(max-width:760px){.top-in{gap:0}.tabs{margin-left:-8px;width:calc(100% + 16px);padding-bottom:8px}.brand b{font-size:14px}}

/* ---------- estructura ---------- */
main{padding:clamp(24px,4vw,48px) 0 80px;outline:0}
h1{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.04;letter-spacing:-.025em;font-weight:700;text-wrap:balance;max-width:19ch}
h2{font-size:clamp(1.55rem,2.6vw,2.05rem);line-height:1.12;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
h3{font-size:1.15rem;line-height:1.25;font-weight:650;letter-spacing:-.01em}
.lead{font-size:1.125rem;color:var(--ink-2);max-width:62ch;margin-top:14px;text-wrap:pretty}
.muted{color:var(--ink-3)}
.head{display:grid;gap:6px;margin-bottom:28px}
.head .lead{margin-top:8px}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,6vw,80px);align-items:start}
.paths{display:grid;gap:12px}
.path{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;transition:border-color .2s,transform .3s var(--ease)}
.path:hover{border-color:var(--ink);transform:translateX(4px)}
.path strong{font-size:1.15rem;font-weight:650;letter-spacing:-.01em}
.path span{color:var(--ink-2);font-size:.97rem;grid-column:1}
.path svg{grid-row:1/3;grid-column:2;width:22px;height:22px}
.path.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.path.main span{color:#D5D8DC}
.estrip{margin-top:clamp(36px,6vw,64px)}
.estrip h2{margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:20px}
.tile{position:relative;background:var(--c);border:0;border-radius:var(--r);padding:18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;transition:transform .3s var(--ease)}
.tile:hover{transform:translateY(-3px)}
.tile img{height:38px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.tile small{display:block;font-size:13px;line-height:1.35;color:inherit;opacity:.92}
.tile b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
@media(max-width:980px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:last-child{grid-column:1/-1}}

/* ---------- controles ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:500;font-size:15px;text-align:left;line-height:1.3;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{display:block;font-size:12.5px;font-weight:400;opacity:.78}
.chip.wide{flex:1 1 100%}
.chip.sm{min-height:36px;padding:6px 11px;font-size:14px}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;min-height:44px;font-weight:600;font-size:15px;transition:background .15s,transform .15s}
.btn:hover{background:#2B3036}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:var(--surface)}
.btn.ok{background:var(--accent);border-color:var(--accent)}
.btn.ok:hover{background:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg,.link svg{width:18px;height:18px;flex:none}
.link{display:inline-flex;gap:6px;align-items:center;background:none;border:0;padding:6px 0;font-weight:600;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.link:hover{color:var(--accent-ink)}
.seg{display:inline-flex;background:var(--line-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:9px 16px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,28,.14)}

/* ---------- pasos ---------- */
.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3vw,40px);align-items:start}
@media(max-width:1020px){.work{grid-template-columns:1fr}}
.steps{display:grid;gap:26px}
.step>h3{display:flex;gap:10px;align-items:baseline;margin-bottom:12px;font-size:1.02rem}
.step>h3 i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;flex:none;transform:translateY(-1px)}
.step.off>h3 i{background:var(--line);color:var(--ink-2)}
.step.off .hint{display:block}
.hint{font-size:14px;color:var(--ink-3)}
.step .chips+.hint{margin-top:10px;display:block}
.ems{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.em{border:2px solid transparent;border-radius:12px;min-height:78px;padding:10px;display:grid;place-items:center;background:var(--c);transition:opacity .2s,transform .3s var(--ease),box-shadow .2s;opacity:.72}
.em img{height:30px;width:auto;max-width:92%;object-fit:contain}
.em:hover{opacity:.9}
.em[aria-pressed=true]{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.em-cap{margin:10px 0 0;font-size:14px;color:var(--ink-2);min-height:21px}
@media(max-width:560px){.ems{grid-template-columns:repeat(3,minmax(0,1fr))}.em{min-height:64px}}

/* ---------- ficha ---------- */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,32px);display:grid;gap:22px}
.sticky{position:sticky;top:88px}
@media(max-width:1020px){.sticky{position:static}}
.ficha.vacia{background:transparent;border-style:dashed;color:var(--ink-3);text-align:left;min-height:220px;align-content:center}
.ficha.vacia strong{color:var(--ink);font-size:1.1rem}
.ficha.anim{animation:entra .5s var(--ease)}
@keyframes entra{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.f-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.f-em{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.f-em i{width:36px;height:24px;border-radius:6px;background:var(--c);display:inline-grid;place-items:center}
.f-em i img{height:14px;width:auto;max-width:28px;object-fit:contain}
.ficha h3.t{font-size:clamp(1.4rem,2.4vw,1.85rem);line-height:1.12;letter-spacing:-.02em;font-weight:700;margin-top:10px;text-wrap:balance}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.tag.prot{background:var(--warn-soft);color:var(--warn)}
.tag.g{background:var(--accent-soft);color:var(--accent-ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.fact{background:var(--surface-2);padding:14px 16px}
.fact dt{font-size:13px;color:var(--ink-3);font-weight:500}
.fact dd{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:650;margin-top:2px;line-height:1.3}
.fact dd.big{font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.sec h4{font-size:13.5px;font-weight:650;color:var(--ink-3);margin-bottom:8px;letter-spacing:.01em}
.sec p{max-width:66ch;text-wrap:pretty}
.sec p+p{margin-top:8px}
.bul{display:grid;gap:8px}
.bul li{position:relative;padding-left:22px;max-width:66ch;text-wrap:pretty}
.bul li::before{content:"";position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.stp{counter-reset:s;display:grid;gap:10px}
.stp li{counter-increment:s;padding-left:34px;position:relative;max-width:66ch}
.stp li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.spec{display:grid;gap:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.spec div{display:grid;grid-template-columns:minmax(120px,.34fr) 1fr;gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line-2)}
.spec div:first-child{border-top:0}
.spec dt{font-weight:600;font-size:14.5px}
.spec dd{color:var(--ink-2);text-wrap:pretty}
@media(max-width:560px){.spec div{grid-template-columns:1fr}}
.callout{display:flex;gap:10px;background:var(--accent-soft);color:#07482C;border-radius:12px;padding:12px 14px;font-size:15px}
.callout.w{background:var(--warn-soft);color:#5E3700}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.fr-list{display:grid;gap:6px}
.fr-list li{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.fr-list li.on{background:var(--accent-soft);border-color:#BFDCCB}
.fr-list b{font-weight:650}
.f-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px solid var(--line-2)}
.f-act .hint{flex:1 1 200px}
/* contador de palabras */
.cnt{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;background:var(--surface-2)}
.cnt label{font-weight:600;font-size:14.5px}
.cnt textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.cnt textarea::placeholder{color:#6F747C}
.meter{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .25s var(--ease),background .2s}
.cnt.over .meter i{background:var(--danger)}
.cnt-t{font-weight:650}
.cnt.over .cnt-t{color:var(--danger)}
/* tabla digital */
.tbl{font-variant-numeric:tabular-nums;width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:13px;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600}
.tbl td:nth-child(2),.tbl td:nth-child(3){white-space:nowrap}
.tw{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;overflow-x:auto}
@media(max-width:640px){.tbl thead{display:none}.tbl tr{display:block;padding:10px 4px;border-bottom:1px solid var(--line-2)}.tbl tr:last-child{border:0}.tbl td{display:grid;grid-template-columns:110px 1fr;gap:10px;border:0;padding:5px 12px}.tbl td::before{content:attr(data-l);font-size:13px;color:var(--ink-3);font-weight:500}.tbl td:first-child{font-size:16px}}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.lk a{color:var(--ink);font-weight:600;font-size:14.5px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;text-decoration:none}
.lk a:hover{border-color:var(--ink)}

/* ---------- por programa ---------- */
.grp{display:grid;gap:10px}
.grp+.grp{margin-top:26px}
.grp>h3{font-size:1.02rem}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.acc summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:14px;min-height:56px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-2)}
.acc summary .n{font-weight:650;flex:1;text-wrap:balance}
.acc summary .d{font-size:14px;color:var(--ink-3)}
.acc summary svg{width:18px;height:18px;transition:transform .25s var(--ease);flex:none}
.acc[open] summary svg{transform:rotate(90deg)}
.acc .body{padding:4px 18px 20px;display:grid;gap:20px}

/* ---------- audiencia ---------- */
.aud{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(20px,3vw,44px);align-items:start}
@media(max-width:1020px){.aud{grid-template-columns:1fr}}
.atajos{margin-bottom:24px}
.atajos h3,.mapbox h3{font-size:1rem;margin-bottom:10px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.4vw,24px)}
.mapa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px}
.ylab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;color:var(--ink-3);font-weight:600;text-align:center;display:none}
.yax{display:grid;grid-template-rows:repeat(5,1fr);gap:0}
.yax button,.xax button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:650;border-radius:8px;transition:background .15s,color .15s}
.yax button{margin:2px 0;min-width:44px;min-height:44px;display:grid;place-items:center;font-size:15px;line-height:1}
.yax small{display:block;font-size:10.5px;font-weight:500;opacity:.8;margin-top:2px}
.yax button[aria-pressed=true],.xax button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.yax button:hover,.xax button:hover{border-color:var(--ink)}
.area{container-type:inline-size;position:relative;aspect-ratio:5/4.4;min-width:0;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2)}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);z-index:6;pointer-events:none}
.cells i{border:1px solid rgba(255,255,255,.55);transition:background .3s var(--ease)}
.cells i.no{background:rgba(243,242,237,.8)}
.rect{position:absolute;opacity:.96;border:2px solid #fff;border-radius:6px;background:var(--c);transition:opacity .3s,filter .3s;z-index:var(--z)}
.rect.dim{opacity:.22;filter:grayscale(.7)}
.rect.hot{z-index:5;opacity:1}
.lab{position:absolute;transform:translate(-50%,-50%);z-index:7;text-align:center;color:#fff;width:max-content;pointer-events:none;transition:opacity .3s}
.lab img{width:15cqw;min-width:44px;height:auto;margin:0 auto}
.lab small{display:block;margin-top:5px;font-size:11.5px;line-height:1.25;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lab.dim{opacity:.25}
@media(max-width:640px){.lab small{display:none}.mapa{gap:8px 6px}.yax button{min-width:34px}.xax{grid-template-columns:40px repeat(5,minmax(0,1fr))}.xax button{margin:0 2px;padding:6px 2px;font-size:12.5px}.xax small{display:none}.xax button::after{content:attr(data-g);display:block;font-weight:500;font-size:10.5px;opacity:.85}}
.xax{display:grid;grid-template-columns:54px repeat(5,minmax(0,1fr));gap:0;margin-top:8px}
.xax button{margin:0 3px}
.xax button{padding:8px 4px;min-height:52px;font-size:13.5px;line-height:1.2}
.xax small{display:block;font-weight:500;font-size:12px;opacity:.85}
.map-cap{font-size:13px;color:var(--ink-3);margin-top:12px}
details.int{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.int summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:650;display:flex;gap:10px;align-items:center;min-height:52px}
details.int summary::-webkit-details-marker{display:none}
details.int summary svg{width:18px;height:18px;transition:transform .25s var(--ease)}
details.int[open] summary svg{transform:rotate(90deg)}
details.int .in{padding:2px 18px 18px;display:grid;gap:16px}
.gh{font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.res{display:grid;gap:12px}
.res-head{display:grid;gap:10px;margin-bottom:6px}
.sum{background:var(--ink);color:#fff;border-radius:16px;padding:18px 20px;display:grid;gap:6px}
.sum b{font-size:1.2rem;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.sum span{color:#D5D8DC;font-size:15px}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:96px 1fr;gap:16px;transition:border-color .2s}
.rk:hover,.rk:focus-within{border-color:var(--ink)}
.rk.cero{opacity:.62}
.rk-t{border-radius:12px;background:var(--c);display:grid;place-items:center;min-height:84px;padding:10px}
.rk-t img{width:100%;max-width:76px;height:auto;max-height:54px;object-fit:contain}
.rk h3{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rk .sub{font-size:14px;color:var(--ink-3);margin-top:2px}
.rk .hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rk .hit{font-size:13.5px;border-radius:8px;padding:3px 9px;background:var(--line-2);font-weight:500}
.rk .hit b{font-weight:700}
.rk .hit.x{color:var(--ink-3);background:transparent;border:1px dashed var(--line)}
.rk .go{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.met{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.met b{font-weight:700;color:var(--ink)}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px;color:var(--ink-2);display:grid;gap:8px}
.vacio strong{color:var(--ink);font-size:1.1rem}
@media(max-width:560px){.rk{grid-template-columns:1fr}.rk-t{min-height:64px;justify-content:start;display:flex;align-items:center}.rk-t img{max-width:90px;max-height:42px}}

/* ---------- plan ---------- */
.plan-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.plan-nm{display:grid;gap:6px;min-width:min(100%,340px)}
.plan-nm label{font-size:14px;font-weight:600;color:var(--ink-2)}
.plan-nm input{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;min-height:46px;background:#fff;color:var(--ink)}
.plan-nm input::placeholder{color:#6F747C}
.plan-acts{display:flex;gap:8px;flex-wrap:wrap}
.pl{display:grid;gap:12px}
.pl-i{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pl-i summary{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none;min-height:64px;border-radius:14px}
.pl-i summary::-webkit-details-marker{display:none}
.pl-i summary:hover{background:var(--surface-2)}
.pl-i .t{flex:1;min-width:0}
.pl-i .t b{display:block;font-weight:650;text-wrap:balance}
.pl-i .t span{font-size:14px;color:var(--ink-3)}
.pl-i .sw{width:44px;height:44px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.pl-i .sw img{width:30px;height:auto;max-height:26px;object-fit:contain}
.pl-i .sw svg{width:22px;height:22px;color:#fff}
.pl-i .body{padding:4px 16px 18px;display:grid;gap:20px}
.rm{background:none;border:1px solid var(--line);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.rm:hover{border-color:var(--danger);color:var(--danger)}
.rm svg{width:18px;height:18px}
.pl-sec{margin-top:30px}
.pl-sec>h3{margin-bottom:12px}
.print-h{display:none}
@media print{
  :root{--bg:#fff}
  body{background:#fff;font-size:12px}
  .top,.plan-acts,.rm,.no-print,.f-act,.cnt{display:none!important}
  main{padding:0}
  .print-h{display:block;margin-bottom:18px}
  .print-h img{height:34px;margin-bottom:10px}
  .pl-i{break-inside:avoid;border-color:#bbb}
  .pl-i .body{display:grid!important}
  details>summary svg{display:none}
}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-3);display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--ease);z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>

const EM = Object.fromEntries(D.emisoras.map(e => [e.id, e]));
const FRJ = {};
for (const fam in D.franjas) FRJ[fam] = Object.fromEntries(D.franjas[fam].map(f => [f.id, f]));
const RADIO = Object.fromEntries(D.radio.map(f => [f.id, f]));
const DIG = Object.fromEntries(D.digital.map(f => [f.id, f]));
const PERF = Object.fromEntries(D.perfiles.map(p => [p.id, p]));
const logo = n => LOGOS[n] || "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r = document) => r.querySelector(s);

/* ---------- iconos (trazo 1.75) ---------- */
const I = {

/* ---------- estado ---------- */
const S = {
  view: "inicio",
  aud: { edad: new Set(), nse: new Set(), perf: new Set(), atajo: null, hot: null },
  radio: { em: null, modo: "formato", tipo: null, fmt: null, fr: null, prog: null },
  dig: { em: null, cat: null, fmt: null },
  plan: [], nombre: "",
};
const KEY = "prisamedia-guia-plan-v1";
try { const raw = JSON.parse(localStorage.getItem(KEY) || "null"); if (raw) { S.plan = (raw.plan || []).filter(validItem); S.nombre = raw.nombre || ""; } } catch (e) { /* sin almacenamiento */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ plan: S.plan, nombre: S.nombre })); } catch (e) { /* ignorar */ } }
function validItem(it) { return it && ((it.k === "r" && RADIO[it.f] && EM[it.e]) || (it.k === "d" && DIG[it.f])); }
const itemKey = it => [it.k, it.e || "", it.f, it.fr || ""].join("|");
const inPlan = it => S.plan.some(x => itemKey(x) === itemKey(it));

/* ---------- utilidades de dominio ---------- */
const famOf = id => EM[id]?.familia;

const tiposDe = fam => [...new Set(radioDe(fam).map(f => f.tipo))];
const frDe = (fmt) => fmt.franjas.map(id => FRJ[fmt.familia][id]);
function chipLabel(f) {
  if (f.tipo === "Grabados") return { t: f.duracion, s: f.nombre.startsWith("Cuña hasta") ? "hasta" : "" };
  if (f.tipo === "Leídos") return { t: f.duracion, s: `${f.palabras} palabras` };
  return { t: f.nombre, s: "" };
}
function words(t) { return (t.trim().match(/\S+/g) || []).length; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2400); }
const sw = e => `style="--c:${e.color}"`;

/* ---------- audiencia ---------- */
function allSet(n) { return new Set([...Array(n).keys()]); }
function effAud() {
  const a = S.aud;
  const edad = a.edad.size ? a.edad : allSet(D.bandasEdad.length);
  const nse = a.nse.size ? a.nse : new Set(D.nse);
  return { edad, nse };
}
function calcAud() {
  const { edad, nse } = effAud();
  const rows = D.emisoras.map(e => {
    const ae = [...edad].filter(i => e.bandas.includes(i)).length;
    const an = [...nse].filter(n => e.nse.includes(n)).length;
    const fit = (ae / edad.size) * (an / nse.size);
    const hits = [...S.aud.perf].map(id => { const p = e.perfiles.find(x => x.id === id); return { id, pct: p ? p.pct : null, label: p ? p.label : PERF[id].label }; });
    const ps = hits.length ? hits.reduce((a, h) => a + (h.pct || 0), 0) / hits.length : 0;
    return { e, ae, an, ne: edad.size, nn: nse.size, fit, hits, ps };
  });
  rows.sort((a, b) => b.fit - a.fit || b.ps - a.ps || b.e.valores.am - a.e.valores.am);
  // cobertura combinada de las celdas edad × NSE seleccionadas
  const cells = []; edad.forEach(i => nse.forEach(n => cells.push([i, n])));
  const cov = e => cells.filter(([i, n]) => e.bandas.includes(i) && e.nse.includes(n));
  const left = new Set(cells.map(c => c.join("-"))); const combo = [];
  while (left.size) {
    let best = null, gain = 0;
    for (const r of rows) { if (combo.includes(r)) continue; const g = cov(r.e).filter(c => left.has(c.join("-"))).length; if (g > gain || (g === gain && best && g > 0 && r.fit > best.fit)) { best = r; gain = g; } }
    if (!best || !gain) break;
    combo.push(best); cov(best.e).forEach(c => left.delete(c.join("-")));
  }
  const covered = cells.length - left.size;
  return { rows, combo, pct: Math.round(100 * covered / cells.length), total: edad.size === D.bandasEdad.length && nse.size === D.nse.length };
}
const fitInfo = f => f >= 0.999 ? ["Cubre todo tu público", "g"] : f >= 0.5 ? ["Cubre gran parte", ""] : f > 0 ? ["Cubre una parte", ""] : ["Fuera de su público", ""];
const nombres = arr => arr.length > 1 ? arr.slice(0, -1).join(", ") + " y " + arr.at(-1) : arr[0] || "";

function vAudiencia() {
  const a = S.aud, r = calcAud();
  const hasSel = a.edad.size || a.nse.size || a.perf.size;
  const atajos = D.atajos.map(t => `<button class="chip" data-a="atajo" data-v="${t.id}" data-fk="atajo-${t.id}" aria-pressed="${a.atajo === t.id}">${esc(t.label)}<small>${esc(t.ayuda)}</small></button>`).join("");
  // mapa
  const Z = { los40: 1, radioacktiva: 2, caracol: 3, tropicana: 4, besame: 5 };
  const P = { los40: [20, 30], radioacktiva: [50, 30], caracol: [80, 20], tropicana: [30, 81], besame: [80, 70] };
  const { edad, nse } = effAud();
  const rects = D.emisoras.map(e => {
    const x0 = Math.min(...e.bandas), x1 = Math.max(...e.bandas) + 1, n0 = Math.min(...e.nse), n1 = Math.max(...e.nse);
    const row = r.rows.find(q => q.e.id === e.id);
    const dim = hasSel && row.fit === 0 ? " dim" : "";
    const hot = a.hot === e.id ? " hot" : "";
    return `<div class="rect${dim}${hot}" style="--c:${e.color};--z:${Z[e.id]};left:${x0 * 20}%;width:${(x1 - x0) * 20}%;top:${(6 - n1) * 20}%;height:${(n1 - n0 + 1) * 20}%" aria-hidden="true"></div>`;
  }).join("");
  const labs = D.emisoras.map(e => {
    const row = r.rows.find(q => q.e.id === e.id); const dim = hasSel && row.fit === 0 ? " dim" : "";
    const [x, y] = P[e.id];
    return `<div class="lab${dim}" style="left:${x}%;top:${y}%" aria-hidden="true"><img src="${logo(e.logoBlanco)}" alt=""><small>${esc(e.rango)}</small></div>`;
  }).join("");
  const veil = []; for (let n = 6; n >= 2; n--) for (let i = 0; i < 5; i++) veil.push(`<i class="${edad.has(i) && nse.has(n) ? "" : "no"}"></i>`);
  const yax = [6, 5, 4, 3, 2].map(n => `<button data-a="nse" data-v="${n}" data-fk="nse-${n}" aria-pressed="${a.nse.has(n)}" aria-label="Nivel socioeconómico ${n}">${n}</button>`).join("");
  const xax = D.bandasEdad.map((b, i) => `<button data-a="edad" data-v="${i}" data-fk="edad-${i}" data-g="${esc(b.gen.split(" ")[0])}" aria-pressed="${a.edad.has(i)}">${esc(b.label)}<small>${esc(b.gen)}</small></button>`).join("");
  // intereses
  const grupos = [...new Set(D.perfiles.map(p => p.grupo))];
  const ints = grupos.map(g => `<div><div class="gh">${esc(g)}</div><div class="chips">${D.perfiles.filter(p => p.grupo === g).map(p => `<button class="chip sm" data-a="perf" data-v="${p.id}" data-fk="perf-${p.id}" aria-pressed="${a.perf.has(p.id)}">${esc(p.label)}</button>`).join("")}</div></div>`).join("");
  // resultados
  let res;
  if (!hasSel) {
    res = `<div class="vacio"><strong>Empieza por tu público</strong><p>Elige un atajo, o marca en el mapa las edades (abajo) y los niveles socioeconómicos (izquierda). Te diremos qué emisoras llegan mejor a ese público.</p><p class="muted">Si no quieres segmentar, ve directo a <button class="link" data-go="radio">Radio</button> y elige la emisora y el programa.</p></div>`;
  } else {
    const list = r.rows.map((q, idx) => {
      const [lbl, cls] = fitInfo(q.fit);
      const det = q.fit === 0 ? "No cubre ninguna de las edades ni niveles elegidos." : `Cubre ${q.ae} de ${q.ne} ${q.ne === 1 ? "grupo de edad" : "grupos de edad"} y ${q.an} de ${q.nn} ${q.nn === 1 ? "nivel" : "niveles"} NSE.`;
      const hits = q.hits.map(h => h.pct == null ? `<span class="hit x">${esc(h.label)}: sin dato</span>` : `<span class="hit">${esc(h.label)} <b>${h.pct}%</b></span>`).join("");
      return `<li class="rk${q.fit === 0 ? " cero" : ""}" data-hot="${q.e.id}">
        <div class="rk-t" ${sw(q.e)}><img src="${logo(q.e.logoBlanco)}" alt=""></div>
        <div><h3>${esc(q.e.nombre)} <span class="tag ${cls}">${lbl}</span></h3>
          <p class="sub">${esc(q.e.formato)} · ${esc(q.e.rango)}</p>
          <p class="sub">${det}</p>
          ${hits ? `<div class="hits">${hits}</div>` : ""}
          <p class="met"><span><b>${q.e.metricas.am}</b> oyentes AM/FM</span><span><b>${q.e.metricas.stream}</b> streaming</span><span><b>${q.e.metricas.redes}</b> redes</span></p>
          <div class="go"><button class="link" data-a="to-radio" data-v="${q.e.id}">Ver formatos de radio ${I.arrow}</button><button class="link" data-a="to-dig" data-v="${q.e.id}">Ver formatos digitales ${I.arrow}</button></div>
        </div></li>`;
    }).join("");
    const rec = r.rows.filter(q => q.fit > 0).map(q => q.e.nombre);
    let msg, sub;
    if (r.total) { msg = "Para llegar a total personas, recomendamos todas las emisoras"; sub = `Cada una cubre una parte distinta del público: ${nombres(r.rows.map(q => q.e.nombre))} cubren juntas el ${r.pct}% del mapa.`; }
    else if (!rec.length) { msg = "Ninguna emisora cubre esta combinación"; sub = "Prueba con otra edad o nivel socioeconómico."; }
    else { msg = `Te recomendamos ${nombres(r.rows.filter(q => q.fit > 0).slice(0, 3).map(q => q.e.nombre))}`; sub = r.combo.length > 1 || r.pct < 100 ? `Para cubrir el ${r.pct}% de tu público combina ${nombres(r.combo.map(q => q.e.nombre))}.` : `${r.combo[0].e.nombre} cubre el ${r.pct}% de tu público.`; }
    res = `<div class="res-head"><div class="sum"><b>${msg}</b><span>${sub}</span></div></div><ol class="res">${list}</ol>`;
  }
  return `<div class="head"><h2>¿A quién quieres llegar?</h2><p class="lead">Marca edad y nivel socioeconómico en el mapa de afinidad, o usa un atajo. Los bloques de color son el público de cada emisora.</p></div>
  <div class="aud"><div>
    <div class="atajos"><h3>Atajos de audiencia</h3><div class="chips">${atajos}</div></div>
    <div class="mapbox"><h3>Mapa de afinidad</h3>
      <div class="mapa"><div class="yax" role="group" aria-label="Nivel socioeconómico">${yax}</div>
        <div class="area">${rects}${labs}<div class="cells">${veil.join("")}</div></div></div>
      <div class="xax" role="group" aria-label="Edad"><span></span>${xax}</div>
      <p class="map-cap">Izquierda: nivel socioeconómico (NSE 2 a 6). Abajo: edad por generación. Fuente: TGI R2 2024.</p>
    </div>
    <details class="int"${a.perf.size ? " open" : ""}><summary>${I.chev} Hábitos e intereses <span class="muted" style="font-weight:400">(opcional)${a.perf.size ? ` · ${a.perf.size} elegidos` : ""}</span></summary><div class="in">${ints}<p class="hint">Porcentaje de oyentes de cada emisora con ese hábito. Fuente: TGI Choices 2026.</p></div></details>
  </div><div aria-live="polite">${res}</div></div>`;
}

/* ---------- fichas de radio ---------- */
function fichaRadio(fmt, emId, frId, o = {}) {
  const e = EM[emId], frs = frDe(fmt), fr = frId ? FRJ[fmt.familia][frId] : (frs.length === 1 ? frs[0] : null);
  const unica = fmt.franjas.length === 1;
  const hLista = fmt.tipo === "Patrocinios" || fmt.tipo === "Vitrinas y esquinas";
  const facts = [];
  facts.push(`<div class="fact"><dt>Duración</dt><dd>${esc(fmt.duracion)}</dd></div>`);
  if (fmt.tipo === "Leídos") facts.push(`<div class="fact"><dt># de palabras</dt><dd class="big">${fmt.palabras}</dd></div>`);
  else if (fmt.maxPalabras && fmt.tipo !== "Remotos") facts.push(`<div class="fact"><dt>Palabras máximas</dt><dd class="big">${fmt.maxPalabras}</dd></div>`);
  else if (fmt.tipo === "Remotos") facts.push(`<div class="fact"><dt>Palabras por salida</dt><dd>300 a 360 (máx.)</dd></div>`);
  facts.push(`<div class="fact"><dt>Franja de pauta</dt><dd>${fr ? esc(fr.nombre) : unica ? esc(frs[0].nombre) : "Por elegir"}</dd></div>`);
  const lista = frs.map(f => `<li class="${fr && fr.id === f.id ? "on" : ""}"><b>${esc(f.nombre)}</b><span>${esc(horarioDe(fmt, f))}</span></li>`).join("");
  const lista8 = frs.length <= 8;
  const frSec = `<div class="sec"><h4>Franja de pauta</h4>${fmt.franjaTexto ? `<p>${esc(fmt.franjaTexto)}</p>` : ""}${fr ? `<ul class="fr-list" style="margin-top:10px"><li class="on"><b>${esc(fr.nombre)}</b><span>${esc(horarioDe(fmt, fr))}</span></li></ul>` : lista8 ? `<ul class="fr-list" style="margin-top:10px">${lista}</ul>` : `<p class="muted" style="margin-top:8px">Elige un programa en el paso 4 para ver su horario.</p>`}</div>`;
  const comp = fmt.componentes.length ? `<div class="sec"><h4>${fmt.tipo === "Secciones" || fmt.tipo === "Individual" ? "Estructura del formato" : "Qué incluye"}</h4><ul class="bul">${fmt.componentes.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : "";
  const desc = !fmt.componentes.length && fmt.descripcion ? `<div class="sec"><h4>${fmt.palabras ? "Texto" : "Descripción"}</h4><p>${esc(fmt.descripcion)}</p></div>` : "";
  const specs = fmt.specs.length ? `<div class="sec"><h4>Especificaciones</h4><dl class="spec">${fmt.specs.map(s => `<div><dt>${esc(s.t)}</dt><dd>${esc(s.d)}</dd></div>`).join("")}</dl></div>` : "";
  const cons = fmt.consejo ? `<div class="callout">${I.info}<span>${esc(fmt.consejo)}</span></div>` : "";
  const cnt = fmt.tipo === "Leídos" && !o.compact ? `<div class="cnt" data-max="${fmt.palabras}"><label for="cnt-${fmt.id}">Verifica tu texto: pégalo y cuenta las palabras</label><textarea id="cnt-${fmt.id}" placeholder="Pega aquí el texto de tu mención…" spellcheck="false"></textarea><div class="meter"><i></i></div><div class="cnt-t" aria-live="polite">0 de ${fmt.palabras} palabras</div></div>` : "";
  const falta = !unica && !fr;
  const added = inPlan({ k: "r", e: emId, f: fmt.id, fr: fr ? fr.id : null });
  const act = o.compact ? "" : `<div class="f-act"><button class="btn ${added ? "ghost" : "ok"}" data-a="plan" data-k="r" data-e="${emId}" data-f="${fmt.id}" data-fr="${fr ? fr.id : ""}" ${falta ? "disabled" : ""}>${added ? I.check + " En mi plan · quitar" : I.plus + " Agregar a mi plan"}</button>${falta ? `<span class="hint">Elige una franja de pauta para agregarlo.</span>` : ""}</div>`;
  const head = o.noHead ? "" : `<div class="f-top"><div><span class="f-em"><i ${sw(e)}><img src="${logo(e.logoBlanco)}" alt=""></i>${esc(e.nombre)} · ${esc(fmt.tipo)}</span><h3 class="t">${esc(fmt.nombre)}</h3></div>${fmt.protegido ? `<span class="tag prot">Formato protegido</span>` : ""}</div>`;
  return `${head}<dl class="facts">${facts.join("")}</dl>${cons}${comp}${desc}${frSec}${specs}${cnt}${act}`;
}

/* ---------- radio ---------- */
function vRadio() {
  const R = S.radio, e = R.em ? EM[R.em] : null;
  const ems = D.emisoras.map(x => `<button class="em" ${sw(x)} data-a="em" data-v="${x.id}" data-fk="em-${x.id}" aria-pressed="${R.em === x.id}" aria-label="${esc(x.nombre)}"><img src="${logo(x.logoBlanco)}" alt=""></button>`).join("");
  const head = `<div class="head"><h2>Formatos de radio</h2><p class="lead">Elige la emisora y llega a la ficha con la duración, el número de palabras, la franja y lo que debes entregar.</p></div>`;
  const top = `<div class="step"><h3><i>1</i> Emisora</h3><div class="ems" role="group" aria-label="Emisora">${ems}</div><p class="em-cap">${e ? `<b>${esc(e.nombre)}</b> · ${esc(e.formato)}` : "&nbsp;"}</p></div>`;
  const modo = `<div class="seg" role="group" aria-label="Cómo quieres explorar"><button data-a="modo" data-v="formato" aria-pressed="${R.modo === "formato"}" data-fk="m-f">Por formato</button><button data-a="modo" data-v="programa" aria-pressed="${R.modo === "programa"}" data-fk="m-p">Por programa</button></div>`;
  if (!e) return `${head}<div class="work"><div class="steps">${top}<p class="hint">Primero elige la emisora.</p></div><div class="ficha vacia sticky"><strong>Aquí verás la ficha técnica</strong><p>Duración, palabras, franja de pauta y especificaciones del formato que elijas.</p></div></div>`;
  const fam = e.familia;
  if (R.modo === "programa") {
    const progs = D.franjas[fam].map(f => `<button class="chip" data-a="prog" data-v="${f.id}" data-fk="pg-${f.id}" aria-pressed="${R.prog === f.id}">${esc(f.nombre)}<small>${esc(f.horario)}</small></button>`).join("");
    let lista = `<div class="ficha vacia"><strong>Elige un programa</strong><p>Te mostramos todos los formatos que puedes pautar ahí.</p></div>`;
    if (R.prog) {
      const prog = FRJ[fam][R.prog];
      const fs = radioDe(fam).filter(f => f.franjas.includes(R.prog));
      const tipos = [...new Set(fs.map(f => f.tipo))];
      lista = `<div><h3 style="margin-bottom:6px">${esc(prog.nombre)}</h3><p class="muted" style="margin-bottom:20px">${esc(prog.horario)} · ${fs.length} formatos disponibles</p>${tipos.map(t => `<div class="grp"><h3>${esc(t)}</h3>${fs.filter(f => f.tipo === t).map(f => {
        const added = inPlan({ k: "r", e: e.id, f: f.id, fr: prog.id });
        const c = chipLabel(f);
        return `<details class="acc"><summary>${I.chev}<span class="n">${esc(f.nombre)}</span><span class="d">${esc(f.tipo === "Leídos" ? c.s : "")}</span>${added ? `<span class="tag g">${I.check.replace("<svg", '<svg style="width:14px;height:14px"')}En mi plan</span>` : ""}</summary><div class="body">${fichaRadio(f, e.id, prog.id, { noHead: true })}</div></details>`;
      }).join("")}</div>`).join("")}</div>`;
    }
    return `${head}<div class="steps" style="margin-bottom:26px">${top}</div><div style="margin-bottom:24px">${modo}</div><div class="work"><div class="steps"><div class="step"><h3><i>2</i> Programa o franja</h3><div class="chips">${progs}</div></div></div><div>${lista}</div></div>`;
  }
  const tipos = tiposDe(fam).map(t => `<button class="chip" data-a="tipo" data-v="${esc(t)}" data-fk="tp-${esc(t)}" aria-pressed="${R.tipo === t}">${esc(t)}</button>`).join("");
  let s2 = "", s3 = "", ficha = `<div class="ficha vacia sticky"><strong>Aquí verás la ficha técnica</strong><p>Elige tipo de formato, formato y franja de pauta. Cada paso se activa al completar el anterior.</p></div>`;
  const fs = R.tipo ? radioDe(fam).filter(f => f.tipo === R.tipo) : [];
  s2 = `<div class="step${R.tipo ? "" : " off"}"><h3><i>3</i> Formato y duración o # de palabras</h3>${R.tipo ? `<div class="chips">${fs.map(f => { const c = chipLabel(f); return `<button class="chip${c.t.length > 22 ? " wide" : ""}" data-a="fmt" data-v="${f.id}" data-fk="f-${f.id}" aria-pressed="${R.fmt === f.id}">${esc(c.t)}${c.s ? `<small>${esc(c.s)}</small>` : ""}</button>`; }).join("")}</div>` : `<span class="hint">Elige primero el tipo de formato.</span>`}</div>`;
  const fm = R.fmt ? RADIO[R.fmt] : null;
  if (fm) {
    const frs = frDe(fm);
    s3 = `<div class="step"><h3><i>4</i> Franja de pauta</h3>${frs.length === 1 ? `<div class="chips"><span class="chip" style="background:var(--accent-soft);border-color:#BFDCCB;cursor:default">${esc(frs[0].nombre)}<small>${esc(horarioDe(fm, frs[0]))}</small></span></div><span class="hint">Este formato solo se emite en esta franja.</span>` : `<div class="chips">${frs.map(f => `<button class="chip" data-a="fr" data-v="${f.id}" data-fk="fr-${f.id}" aria-pressed="${R.fr === f.id}">${esc(f.nombre)}<small>${esc(horarioDe(fm, f))}</small></button>`).join("")}</div>`}</div>`;
    ficha = `<article class="ficha anim sticky" id="ficha" aria-label="Ficha técnica">${fichaRadio(fm, e.id, R.fr)}</article>`;
  } else s3 = `<div class="step off"><h3><i>4</i> Franja de pauta</h3><span class="hint">Elige primero el formato.</span></div>`;
  return `${head}<div class="steps" style="margin-bottom:26px">${top}</div><div style="margin-bottom:24px">${modo}</div><div class="work"><div class="steps"><div class="step"><h3><i>2</i> Tipo de formato</h3><div class="chips">${tipos}</div></div>${s2}${s3}</div>${ficha}</div>`;
}

/* ---------- digital ---------- */
function fichaDigital(f, o = {}) {
  const hasExp = f.piezas.some(p => p.expande), hasPeso = f.piezas.some(p => p.peso);
  const tabla = f.piezas.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Pieza</th><th>${hasExp ? "Tamaño inicial" : "Tamaño o duración"}</th>${hasExp ? "<th>Expandido</th>" : ""}${hasPeso ? "<th>Peso máximo</th>" : ""}<th>Archivo</th><th>Observaciones</th></tr></thead><tbody>${f.piezas.map(p => `<tr><td data-l="Pieza">${esc(p.pieza)}</td><td data-l="Tamaño">${esc(p.medida)}</td>${hasExp ? `<td data-l="Expandido">${esc(p.expande || "N/A")}</td>` : ""}${hasPeso ? `<td data-l="Peso máx.">${esc(p.peso || "—")}</td>` : ""}<td data-l="Archivo">${esc(p.archivo)}</td><td data-l="Observaciones">${esc(p.obs || "—")}</td></tr>`).join("")}</tbody></table></div>` : "";
  const texto = f.texto ? `<div class="callout w">${I.info}<span><b>Texto del post:</b> ${esc(f.texto)}</span></div>` : "";
  const reqLabel = f.categoria === "Redes sociales" ? "Reglas de publicación" : f.pasos.length ? "" : f.categoria.startsWith("Contenidos") ? "Qué necesitas" : "Ten en cuenta";
  const notas = f.notas.length ? `<div class="sec"><h4>${reqLabel}</h4><ul class="bul">${f.notas.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
  const pasos = f.pasos.length ? `<div class="sec"><h4>Pasos</h4><ol class="stp">${f.pasos.map(n => `<li>${esc(n)}</li>`).join("")}</ol></div>` : "";
  const lk = f.enlaces.length ? `<div class="sec"><h4>Fanpages</h4><div class="lk">${f.enlaces.map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join("")}</div></div>` : "";
  const added = inPlan({ k: "d", f: f.id });
  const act = o.compact ? "" : `<div class="f-act"><button class="btn ${added ? "ghost" : "ok"}" data-a="plan" data-k="d" data-f="${f.id}">${added ? I.check + " En mi plan · quitar" : I.plus + " Agregar a mi plan"}</button></div>`;
  const head = o.noHead ? "" : `<div class="f-top"><div><span class="f-em">${esc(f.categoria)}</span><h3 class="t">${esc(f.nombre)}</h3></div><span class="tag">${f.piezas.length ? f.piezas.length + (f.piezas.length === 1 ? " pieza" : " piezas") : "Contenido"}</span></div>`;
  const apl = f.emisoras.length ? `<div class="callout">${I.info}<span>Aplica para: <b>${esc(f.aplica)}</b></span></div>` : "";
  return `${head}${apl}${texto}${tabla}${notas}${pasos}${lk}${act}`;
}
function vDigital() {
  const G = S.dig, cats = [...new Set(D.digital.map(f => f.categoria))];
  const visible = f => !G.em || !f.emisoras.length || f.emisoras.includes(G.em);
  const emf = [`<button class="chip sm" data-a="dem" data-v="" data-fk="de-" aria-pressed="${!G.em}">Todas</button>`].concat(D.emisoras.map(x => `<button class="chip sm" data-a="dem" data-v="${x.id}" data-fk="de-${x.id}" aria-pressed="${G.em === x.id}">${esc(x.nombre)}</button>`)).join("");
  const catsH = cats.map(c => `<button class="chip" data-a="cat" data-v="${esc(c)}" data-fk="c-${esc(c)}" aria-pressed="${G.cat === c}">${esc(c)}</button>`).join("");
  const fs = G.cat ? D.digital.filter(f => f.categoria === G.cat && visible(f)) : [];
  const fmt = G.fmt && DIG[G.fmt] && visible(DIG[G.fmt]) ? DIG[G.fmt] : null;
  const s2 = G.cat ? `<div class="step"><h3><i>3</i> Formato</h3><div class="chips">${fs.map(f => `<button class="chip${f.nombre.length > 24 ? " wide" : ""}" data-a="dfmt" data-v="${f.id}" data-fk="df-${f.id}" aria-pressed="${G.fmt === f.id}">${esc(f.nombre)}${f.piezas.length > 1 ? `<small>${f.piezas.length} piezas</small>` : f.piezas.length === 1 ? `<small>${esc(f.piezas[0].medida)}</small>` : ""}</button>`).join("")}</div></div>` : `<div class="step off"><h3><i>3</i> Formato</h3><span class="hint">Elige primero el tipo de pieza.</span></div>`;
  const ficha = fmt ? `<article class="ficha anim sticky" id="ficha" aria-label="Ficha técnica">${fichaDigital(fmt)}</article>` : `<div class="ficha vacia sticky"><strong>Aquí verás las medidas y pesos</strong><p>Elige el tipo de pieza y el formato para ver tamaños, peso máximo, archivo y lo que debes tener en cuenta.</p></div>`;
  return `<div class="head"><h2>Formatos digitales</h2><p class="lead">Medidas, pesos y archivos para web, mobile, audio y video en streaming, redes sociales y contenidos.</p></div>
  <div class="work"><div class="steps">
    <div class="step"><h3><i>1</i> Emisora <span class="hint" style="font-weight:400">(opcional)</span></h3><div class="chips">${emf}</div><span class="hint">Filtra los formatos propios de cada emisora, como Brand Day.</span></div>
    <div class="step"><h3><i>2</i> Tipo de pieza</h3><div class="chips">${catsH}</div></div>${s2}</div>${ficha}</div>`;
}

/* ---------- mi plan ---------- */
function planTexto() {
  const L = [`PLAN DE PAUTA${S.nombre ? " · " + S.nombre : ""}`, "Prisa Media · Guía de formatos", ""];
  S.plan.forEach((it, i) => {
    if (it.k === "r") {
      const f = RADIO[it.f], e = EM[it.e], fr = it.fr ? FRJ[f.familia][it.fr] : null;
      L.push(`${i + 1}. RADIO · ${e.nombre} · ${f.tipo} · ${f.nombre}`);
      L.push(`   Duración: ${f.duracion}${f.palabras ? " · " + f.palabras + " palabras" : ""}`);
      if (fr) L.push(`   Franja: ${fr.nombre} (${horarioDe(f, fr)})`);
      if (f.franjaTexto) L.push(`   ${f.franjaTexto}`);
      f.componentes.forEach(c => L.push(`   - ${c}`));
      f.specs.forEach(s => L.push(`   ${s.t}: ${s.d}`));
    } else {
      const f = DIG[it.f]; L.push(`${i + 1}. DIGITAL · ${f.categoria} · ${f.nombre}`);
      f.piezas.forEach(p => L.push(`   - ${p.pieza}: ${p.medida}${p.expande ? " → " + p.expande : ""}${p.peso ? " · " + p.peso : ""} · ${p.archivo}${p.obs ? " · " + p.obs : ""}`));
      if (f.texto) L.push(`   Texto: ${f.texto}`);
      f.notas.forEach(n => L.push(`   - ${n}`)); f.pasos.forEach((n, j) => L.push(`   ${j + 1}) ${n}`));
    }
    L.push("");
  });
  return L.join("\n");
}
function vPlan() {
  const rad = S.plan.filter(i => i.k === "r"), dig = S.plan.filter(i => i.k === "d");
  const head = `<div class="print-h"><img src="${logo("prisamedia")}" alt="Prisa Media"><h2>Plan de pauta${S.nombre ? ": " + esc(S.nombre) : ""}</h2><p class="muted">Especificaciones de los formatos seleccionados. Guía de formatos Prisa Media.</p></div>`;
  if (!S.plan.length) return `${head}<div class="head no-print"><h2>Mi plan de pauta</h2><p class="lead">Aquí reúnes los formatos que vas eligiendo para tener todas sus especificaciones en un solo lugar y guardarlas en PDF.</p></div>
    <div class="vacio no-print"><strong>Todavía no has agregado formatos</strong><p>En cada ficha encontrarás el botón «Agregar a mi plan».</p><div class="chips" style="margin-top:8px"><button class="btn" data-go="radio">Explorar radio</button><button class="btn ghost" data-go="digital">Explorar digital</button><button class="btn ghost" data-go="audiencia">Buscar por audiencia</button></div></div>`;
  const row = it => {
    if (it.k === "r") {
      const f = RADIO[it.f], e = EM[it.e], fr = it.fr ? FRJ[f.familia][it.fr] : null;
      return `<details class="pl-i"><summary><span class="sw" ${sw(e)}><img src="${logo(e.logoBlanco)}" alt=""></span><span class="t"><b>${esc(f.nombre)}</b><span>${esc(e.nombre)} · ${esc(f.tipo)}${fr ? " · " + esc(fr.nombre) : ""}</span></span><button class="rm" data-a="rm" data-key="${esc(itemKey(it))}" aria-label="Quitar ${esc(f.nombre)} del plan">${I.trash}</button></summary><div class="body">${fichaRadio(f, e.id, it.fr, { compact: true, noHead: true })}</div></details>`;
    }
    const f = DIG[it.f];
    return `<details class="pl-i"><summary><span class="sw" style="--c:#15181C">${I.screen}</span><span class="t"><b>${esc(f.nombre)}</b><span>${esc(f.categoria)}</span></span><button class="rm" data-a="rm" data-key="${esc(itemKey(it))}" aria-label="Quitar ${esc(f.nombre)} del plan">${I.trash}</button></summary><div class="body">${fichaDigital(f, { compact: true, noHead: true })}</div></details>`;
  };
  return `${head}<div class="plan-head no-print"><div class="head" style="margin:0"><h2>Mi plan de pauta</h2><p class="lead">${S.plan.length} ${S.plan.length === 1 ? "formato" : "formatos"} con todas sus especificaciones.</p></div>
    <div class="plan-acts"><button class="btn" data-a="print">${I.print} Imprimir o guardar PDF</button><button class="btn ghost" data-a="copy">${I.copy} Copiar resumen</button><button class="btn ghost" data-a="clear">Vaciar plan</button></div></div>
    <div class="plan-nm no-print" style="margin-bottom:24px"><label for="nm">Nombre de la campaña (opcional)</label><input id="nm" value="${esc(S.nombre)}" placeholder="Ej. Lanzamiento marzo" maxlength="80"></div>
    ${rad.length ? `<section class="pl-sec" style="margin-top:0"><h3>Radio</h3><div class="pl">${rad.map(row).join("")}</div></section>` : ""}
    ${dig.length ? `<section class="pl-sec"><h3>Digital</h3><div class="pl">${dig.map(row).join("")}</div></section>` : ""}`;
}

/* ---------- inicio ---------- */
function vInicio() {
  const tiles = D.emisoras.map(e => `<button class="tile" ${sw(e)} data-a="to-radio" data-v="${e.id}" aria-label="Ver formatos de ${esc(e.nombre)}"><img src="${logo(e.logoBlanco)}" alt=""><span><b>${e.metricas.am}</b><small>oyentes AM/FM · ${esc(e.rango)}</small></span></button>`).join("");
  return `<section class="hero"><div><h1>Elige tu formato y conoce qué debes entregar</h1><p class="lead">Consulta duraciones, palabras, franjas de pauta y medidas de las piezas de radio y digital de Prisa Media. Si quieres segmentar, te recomendamos la emisora para tu público.</p></div>
  <div class="paths"><button class="path main" data-go="audiencia"><strong>Quiero llegar a una audiencia</strong><span>Indica edad y nivel socioeconómico y te recomendamos la emisora.</span>${I.arrow}</button>
  <button class="path" data-go="radio"><strong>Ya sé la emisora y el programa</strong><span>Ve directo a los formatos de radio y sus especificaciones.</span>${I.arrow}</button>
  <button class="path" data-go="digital"><strong>Necesito medidas de piezas digitales</strong><span>Web, mobile, streaming, redes sociales y contenidos.</span>${I.arrow}</button></div></section>
  <section class="estrip"><h2>Cinco emisoras, un público para cada marca</h2><p class="lead" style="margin-top:8px">Toca una emisora para ver sus formatos.</p><div class="tiles">${tiles}</div></section>
  <div class="foot"><span>Fuentes: especificaciones de formatos Prisa Media · audiencias TGI Choices 2026 y TGI R2 2024.</span><span>Guía de consulta para planificación; las condiciones comerciales las confirma tu ejecutivo.</span></div>`;
}

/* ---------- render ---------- */
const TABS = [["inicio", "Inicio"], ["audiencia", "Audiencia"], ["radio", "Radio"], ["digital", "Digital"], ["plan", "Mi plan"]];
function render(opts = {}) {
  const act = document.activeElement, fk = act && act.dataset ? act.dataset.fk : null;
  $("#tabs").innerHTML = TABS.map(([id, n]) => `<button class="tab" data-go="${id}" ${S.view === id ? 'aria-current="page"' : ""}>${n}${id === "plan" && S.plan.length ? `<span class="badge" aria-label="${S.plan.length} formatos">${S.plan.length}</span>` : ""}</button>`).join("");
  const v = { inicio: vInicio, audiencia: vAudiencia, radio: vRadio, digital: vDigital, plan: vPlan }[S.view]();
  const view = $("#view"); const y = window.scrollY; view.innerHTML = v;
  if (!opts.top) window.scrollTo(0, y);
  if (fk) { const el = view.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({ preventScroll: true }); }
  const ficha = $("#ficha"); if (ficha && opts.reveal && window.innerWidth <= 1020) ficha.scrollIntoView({ behavior: "smooth", block: "start" });
}
function go(v, extra) { S.view = v; history.replaceState(null, "", "#" + v); render({ top: true }); window.scrollTo(0, 0); }
function tog(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v, R = S.radio, A = S.aud;
  if (a === "atajo") { const t = D.atajos.find(x => x.id === v); A.atajo = A.atajo === v ? null : v; A.edad = new Set(A.atajo ? t.edad : []); A.nse = new Set(A.atajo ? t.nse : []); }
  else if (a === "edad") { tog(A.edad, +v); A.atajo = null; }
  else if (a === "nse") { tog(A.nse, +v); A.atajo = null; }
  else if (a === "perf") tog(A.perf, v);
  else if (a === "to-radio") { if (R.em !== v) Object.assign(R, { em: v, tipo: null, fmt: null, fr: null, prog: null }); S.view = "radio"; history.replaceState(null, "", "#radio"); render({ top: true }); window.scrollTo(0, 0); return; }
  else if (a === "to-dig") { S.dig.em = v; S.dig.fmt = null; S.view = "digital"; history.replaceState(null, "", "#digital"); render({ top: true }); window.scrollTo(0, 0); return; }
  else if (a === "em") { if (R.em !== v) Object.assign(R, { em: v, tipo: null, fmt: null, fr: null, prog: null }); }
  else if (a === "modo") R.modo = v;
  else if (a === "prog") R.prog = v;
  else if (a === "tipo") { R.tipo = v; R.fmt = null; R.fr = null; }
  else if (a === "fmt") { R.fmt = v; R.fr = null; var reveal = true; const f = RADIO[v]; if (f.franjas.length === 1) R.fr = f.franjas[0]; }
  else if (a === "fr") { R.fr = v; reveal = true; }
  else if (a === "dem") { S.dig.em = v || null; if (S.dig.fmt && DIG[S.dig.fmt].emisoras.length && v && !DIG[S.dig.fmt].emisoras.includes(v)) S.dig.fmt = null; }
  else if (a === "cat") { S.dig.cat = v; S.dig.fmt = null; }
  else if (a === "dfmt") { S.dig.fmt = v; reveal = true; }
  else if (a === "plan") {
    const it = b.dataset.k === "r" ? { k: "r", e: b.dataset.e, f: b.dataset.f, fr: b.dataset.fr || null } : { k: "d", f: b.dataset.f };
    if (inPlan(it)) { S.plan = S.plan.filter(x => itemKey(x) !== itemKey(it)); toast("Quitado de tu plan"); } else { S.plan.push(it); toast("Agregado a tu plan"); }
    save();
  } else if (a === "rm") { ev.preventDefault(); S.plan = S.plan.filter(x => itemKey(x) !== b.dataset.key); save(); toast("Quitado de tu plan"); }
  else if (a === "clear") { if (confirm("¿Vaciar todo el plan?")) { S.plan = []; save(); } }
  else if (a === "print") { window.print(); return; }
  else if (a === "copy") { const t = planTexto(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Resumen copiado"), () => toast("No se pudo copiar. Usa «Imprimir o guardar PDF»")); return; }
  render({ reveal });
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "nm") { S.nombre = t.value; save(); const h = $(".print-h h2"); if (h) h.textContent = "Plan de pauta" + (S.nombre ? ": " + S.nombre : ""); }
  const c = t.closest && t.closest(".cnt");
  if (c && t.tagName === "TEXTAREA") {
    const max = +c.dataset.max, n = words(t.value), over = n > max;
    c.classList.toggle("over", over);
    $(".meter i", c).style.width = Math.min(100, n / max * 100) + "%";
    $(".cnt-t", c).textContent = over ? `${n} de ${max} palabras · te pasas por ${n - max}` : n === max ? `${n} de ${max} palabras · justo` : `${n} de ${max} palabras · te quedan ${max - n}`;
  }
});
/* resaltar rectángulo del mapa al pasar por un resultado */
document.addEventListener("mouseover", ev => { const r = ev.target.closest(".rk"); const id = r ? r.dataset.hot : null; if (S.view === "audiencia" && S.aud.hot !== id) { S.aud.hot = id; $$hot(); } });
document.addEventListener("focusin", ev => { const r = ev.target.closest && ev.target.closest(".rk"); const id = r ? r.dataset.hot : null; if (S.view === "audiencia" && S.aud.hot !== id) { S.aud.hot = id; $$hot(); } });
function $$hot() { document.querySelectorAll(".rect").forEach((el, i) => el.classList.toggle("hot", D.emisoras[i].id === S.aud.hot)); }

const h0 = location.hash.slice(1); if (TABS.some(t => t[0] === h0)) S.view = h0;
render({ top: true });
</script>
</body>
</html>
